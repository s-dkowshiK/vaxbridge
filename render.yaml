# Render setup: https://render.com/docs/blueprint-spec
# Render builds the Dockerfile and runs it with HTTPS. The database is a free Neon PostgreSQL database;
# paste its connection string as DATABASE_URL when Render asks.
services:
  - type: web
    name: vaxbridge
    runtime: docker
    plan: free
    healthCheckPath: /api/antigens
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: COOKIE_SECURE
        value: "true"
