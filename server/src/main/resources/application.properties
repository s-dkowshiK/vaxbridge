spring.application.name=vaxbridge
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=60MB

# Accounts and saved records live in a small database file next to where the app runs (./data).
# Online, set DATABASE_URL to a PostgreSQL database instead (see VaxBridgeApplication).
spring.datasource.url=jdbc:h2:file:./data/vaxbridge
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Hosts like Render tell the app which port to use and put HTTPS in front of it.
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=8h
spring.session.timeout=8h
spring.session.jdbc.initialize-schema=always
